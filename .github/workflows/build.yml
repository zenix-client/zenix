name: Build ZENIX

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          mkdir -p project
          ZIP="$(find . -maxdepth 2 -type f -iname '*.zip' \
            ! -path './.git/*' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP archive not found"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "Archive: $ZIP"
          unzip -o "$ZIP" -d project

          echo "Files extracted:"
          find project -maxdepth 4 -type f | head -100

          BUILD_FILE="$(find project -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            | head -n 1)"

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found inside archive"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project: $PROJECT_DIR"

      - name: Build mod
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle build --stacktrace --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ZENIX-CLIENT
          path: |
            project/**/build/libs/*.jar
          if-no-files-found: error
