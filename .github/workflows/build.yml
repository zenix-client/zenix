name: Build ZENIX

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Unpack project zip if used
        shell: bash
        run: |
          mkdir -p project
          if [ -f zenix-project.zip ]; then
            unzip -q -o zenix-project.zip -d project
          else
            find . -maxdepth 1 -mindepth 1 ! -name project ! -name .git ! -name .github -exec cp -r {} project/ \;
          fi
          find project -maxdepth 3 -type f | head -80

      - name: Find Gradle project
        id: gradle_dir
        shell: bash
        run: |
          if [ -f project/settings.gradle ] || [ -f project/settings.gradle.kts ] || [ -f project/build.gradle ] || [ -f project/build.gradle.kts ]; then
            echo "dir=project" >> "$GITHUB_OUTPUT"
          else
            BUILD_FILE=$(find project -maxdepth 4 \( -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts \) -print -quit)
            if [ -z "$BUILD_FILE" ]; then
              echo "Не найден build.gradle или settings.gradle внутри ZIP"
              exit 1
            fi
            echo "dir=$(dirname "$BUILD_FILE")" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        working-directory: ${{ steps.gradle_dir.outputs.dir }}
        run: gradle build --stacktrace --no-daemon

      - name: Find and verify JAR
        shell: bash
        run: |
          J=$(find "${{ steps.gradle_dir.outputs.dir }}/build/libs" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -print -quit)
          if [ -z "$J" ]; then
            echo "JAR не найден в build/libs"
            find project -path '*/build/libs/*' -type f
            exit 1
          fi
          mkdir -p output
          cp "$J" output/zenix-client.jar
          unzip -l output/zenix-client.jar | head -80

      - uses: actions/upload-artifact@v4
        with:
          name: zenix-client
          path: output/zenix-client.jar
